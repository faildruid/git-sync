name: Helm CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Lint chart
        run: |
          helm lint .

      - name: Run unit tests
        run: |
          helm unittest .
