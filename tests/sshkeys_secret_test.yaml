suite: SSH keys Secret tests
templates:
  - secret-sshkeys.yaml
tests:
  - it: should render SSH keys secret with both keys when enabled
    values:
      - fixtures/values-basic.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.id_rsa_tools
          value: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            FIXTURE-KEY-1
            -----END OPENSSH PRIVATE KEY-----
      - equal:
          path: stringData.id_rsa_wdf
          value: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            FIXTURE-KEY-2
            -----END OPENSSH PRIVATE KEY-----

  - it: should not render SSH keys secret when sshKeys.create is false
    values:
      - fixtures/values-basic.yaml
    set:
      sshKeys.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use custom ssh secret name when overridden
    values:
      - fixtures/values-basic.yaml
    set:
      sshKeys.secretName: "custom-ssh-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "custom-ssh-secret"
