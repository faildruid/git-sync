suite: ServiceAccount tests
templates:
  - serviceaccount.yaml
tests:
  - it: should render ServiceAccount with default generated name
    values:
      - fixtures/values-basic.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-gitsync"

  - it: should render ServiceAccount with custom name when overridden
    values:
      - fixtures/values-basic.yaml
    set:
      serviceAccount.name: "custom-sa"
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: "custom-sa"

  - it: should not render ServiceAccount when create is false
    values:
      - fixtures/values-basic.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
