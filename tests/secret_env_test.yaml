suite: Secret env tests
templates:
  - secret-env.yaml
tests:
  - it: should render secret for env vars when enabled and vars exist
    values:
      - fixtures/values-basic.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.TOOLS_ORG
          value: https://github.tools.sap/cpe

  - it: should use custom env secret name when overridden
    values:
      - fixtures/values-basic.yaml
    set:
      secretEnv.secretName: "custom-env-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "custom-env-secret"
